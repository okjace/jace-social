# Part of "Build and release" (ci.yml): the Jace Social phone apps, native (docs/native-apps.md):
# Android (android/, Kotlin) and iPhone (ios/, Swift). Builds both, starts each (Android emulator,
# iOS simulator) against a fake API (native-test/) and screenshots its screens. The release builds:
#   jace_social_mobile-<version>-android.apk       signed with the release key (secrets), installs
#                                                  over earlier versions, the Capacitor 1.x app too
#   jace_social_mobile-<version>-ios-unsigned.ipa  for sideloading (AltStore / Sideloadly)
#   jace_social_mobile-<version>-ios12-unsigned.ipa  the app for older iPhones (iOS 12+, ios12/),
#                                                  also for sideloading; not sent to Jace Store
# The version is mobile/package.json's "version", what's new is in mobile/CHANGELOG.md.
name: Phone apps

on:
  workflow_call:
    inputs:
      release:
        description: "Publish this build (all its tests passed and its version isn't released yet)"
        type: boolean
        default: false
      tag:
        description: "The release's tag, e.g. mobile-v2.0.0"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Version
        run: echo "JACE_ANDROID_VERSION=$(python3 -c "import json; print(json.load(open('../mobile/package.json'))['version'])")" >> "$GITHUB_ENV"
      - name: Build
        env:
          JACE_API_BASE: http://10.0.2.2:8787   # the fake API on the runner (debug builds only; not released)
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name it
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/jace_social_native-android-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: native-android
          path: dist/*.apk
      # the real build: the real server, signed with the release key (the same as the Capacitor
      # app's, so it installs over it). Kept with the run; published when this version is released.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            # a debug key changes every build, so phones couldn't update to the next release
            if [ "${{ inputs.release }}" = "true" ]; then echo "::error::Run packaging/make_android_key.sh first (sets the ANDROID_KEYSTORE_* secrets)"; exit 1; fi
            echo "::warning::No release key: this build is debug-signed"; exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Build the release (real server)
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/jace_social_mobile-$JACE_ANDROID_VERSION-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-android
          path: release/*.apk

  android-run:
    # install it on an emulator, open it and screenshot it
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-android
          path: dl
      - name: Start the fake API
        run: nohup python3 native-test/mock_api.py 8787 > mock.log 2>&1 &
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # (the runner runs each line of a script on its own, so the steps are in a file)
          script: bash native-test/android-shots.sh
      - name: What the fake API was asked
        if: always()
        run: tail -40 mock.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-android-screenshots
          path: "*.png"

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: echo "JACE_MOBILE_VERSION=$(python3 -c "import json; print(json.load(open('../mobile/package.json'))['version'])")" >> "$GITHUB_ENV"
      - name: Make the Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild -project JaceSocial.xcodeproj -scheme JaceSocial -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; tail -20 build.log; exit 1; }
          test -d "build/Build/Products/Debug-iphonesimulator/Jace Social.app"
      - name: Start the fake API
        working-directory: .
        run: nohup python3 native-test/mock_api.py 8787 > mock.log 2>&1 &
      - name: Start it in the simulator and screenshot it
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if 'iPhone' in x['name']))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "build/Build/Products/Debug-iphonesimulator/Jace Social.app"
          xcrun simctl launch "$DEVICE" dev.jacedeb.jacesocial
          sleep 15
          xcrun simctl io "$DEVICE" screenshot ../ios-start.png
          # signed in, against the fake API (started in the step before)
          curl -sS -m 5 -H "Authorization: Bearer demo" http://127.0.0.1:8787/api/v1/me | head -c 200; echo
          xcrun simctl terminate "$DEVICE" dev.jacedeb.jacesocial
          SIMCTL_CHILD_JACE_API_BASE=http://127.0.0.1:8787 xcrun simctl launch "$DEVICE" dev.jacedeb.jacesocial -jaceToken demo
          sleep 25
          xcrun simctl io "$DEVICE" screenshot ../ios-chats.png
          xcrun simctl terminate "$DEVICE" dev.jacedeb.jacesocial
          SIMCTL_CHILD_JACE_API_BASE=http://127.0.0.1:8787 xcrun simctl launch "$DEVICE" dev.jacedeb.jacesocial -jaceToken demo -jaceOpen dm:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb:Steve
          sleep 25
          xcrun simctl io "$DEVICE" screenshot ../ios-chat.png
          xcrun simctl terminate "$DEVICE" dev.jacedeb.jacesocial
          SIMCTL_CHILD_JACE_API_BASE=http://127.0.0.1:8787 xcrun simctl launch "$DEVICE" dev.jacedeb.jacesocial -jaceToken demo -jaceOpen "server:22222222-2222-2222-2222-222222222222:Jace Craft"
          sleep 20
          xcrun simctl io "$DEVICE" screenshot ../ios-server.png
          for shot in "profile:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb:x" "serversettings:22222222-2222-2222-2222-222222222222:x" "bots:x:x"; do
            xcrun simctl terminate "$DEVICE" dev.jacedeb.jacesocial
            SIMCTL_CHILD_JACE_API_BASE=http://127.0.0.1:8787 xcrun simctl launch "$DEVICE" dev.jacedeb.jacesocial -jaceToken demo -jaceOpen "$shot"
            sleep 15
            xcrun simctl io "$DEVICE" screenshot "../ios-${shot%%:*}.png"
          done
          tail -30 ../mock.log
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "Jace Social"' | grep -iE "jace api|error|fail|ats|transport" | tail -40 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ios-screenshots
          path: "*.png"
      - name: Build the release (unsigned, for sideloading)
        run: |
          IFS=. read -r MA MI PA <<< "$JACE_MOBILE_VERSION"
          xcodebuild -project JaceSocial.xcodeproj -scheme JaceSocial -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath release \
            MARKETING_VERSION="$JACE_MOBILE_VERSION" CURRENT_PROJECT_VERSION=$((MA * 10000 + MI * 100 + PA)) \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > release.log 2>&1 \
            || { grep -E "error:" release.log | sort -u; tail -20 release.log; exit 1; }
          mkdir -p ../dist Payload
          cp -R "release/Build/Products/Release-iphoneos/Jace Social.app" Payload/
          zip -qry "../dist/jace_social_mobile-$JACE_MOBILE_VERSION-ios-unsigned.ipa" Payload
          ls -l ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-ios
          path: dist/*.ipa

  ios12:
    # the app for older iPhones (ios12/: UIKit, iOS 12+). GitHub's simulators only have new iOS
    # versions, so it's tested there; the release check below makes sure it still allows iOS 12.
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios12
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: echo "JACE_MOBILE_VERSION=$(python3 -c "import json; print(json.load(open('../mobile/package.json'))['version'])")" >> "$GITHUB_ENV"
      - name: Xcode 16 (newer Xcodes can't build for iOS 12)
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Make the Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild -project JaceSocial.xcodeproj -scheme JaceSocial -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; tail -20 build.log; exit 1; }
          grep -E "warning:" build.log | grep -v "xcodebuild\[" | sort -u | head -30 || true
          test -d "build/Build/Products/Debug-iphonesimulator/Jace Social.app"
      - name: Start the fake API
        working-directory: .
        run: nohup python3 native-test/mock_api.py 8787 > mock.log 2>&1 &
      - name: Start it in the simulator and screenshot it
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if 'iPhone' in x['name']))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP="build/Build/Products/Debug-iphonesimulator/Jace Social.app"
          ID=dev.jacedeb.jacesocial.ios12
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" $ID
          sleep 10
          xcrun simctl io "$DEVICE" screenshot ../ios12-start.png
          for shot in "chats" "dm:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb:Steve" "server:22222222-2222-2222-2222-222222222222:Jace Craft"; do
            xcrun simctl terminate "$DEVICE" $ID || true
            if [ "$shot" = chats ]; then
              SIMCTL_CHILD_JACE_API_BASE=http://127.0.0.1:8787 xcrun simctl launch "$DEVICE" $ID -jaceToken demo
            else
              SIMCTL_CHILD_JACE_API_BASE=http://127.0.0.1:8787 xcrun simctl launch "$DEVICE" $ID -jaceToken demo -jaceOpen "$shot"
            fi
            sleep 15
            xcrun simctl io "$DEVICE" screenshot "../ios12-${shot%%:*}.png"
          done
          # still running (didn't crash)?
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$ID" || { echo "::error::the app isn't running any more (crashed?)"; exit 1; }
          tail -30 ../mock.log
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "Jace Social"' | grep -iE "error|fail|crash|fatal" | tail -40 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ios12-screenshots
          path: "*.png"
      - name: Build the release (unsigned, for sideloading)
        run: |
          IFS=. read -r MA MI PA <<< "$JACE_MOBILE_VERSION"
          xcodebuild -project JaceSocial.xcodeproj -scheme JaceSocial -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath release \
            MARKETING_VERSION="$JACE_MOBILE_VERSION" CURRENT_PROJECT_VERSION=$((MA * 10000 + MI * 100 + PA)) \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > release.log 2>&1 \
            || { grep -E "error:" release.log | sort -u; tail -20 release.log; exit 1; }
          BIN="release/Build/Products/Release-iphoneos/Jace Social.app/Jace Social"
          # it must still start on iOS 12
          MINOS=$(xcrun vtool -show-build "$BIN" | awk '/minos/ {print $2; exit}')
          echo "Minimum iOS: $MINOS"
          case "$MINOS" in 12.*) ;; *) echo "::error::the app needs iOS $MINOS, not 12"; exit 1 ;; esac
          mkdir -p ../dist Payload
          cp -R "release/Build/Products/Release-iphoneos/Jace Social.app" Payload/
          zip -qry "../dist/jace_social_mobile-$JACE_MOBILE_VERSION-ios12-unsigned.ipa" Payload
          ls -l ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-ios12
          path: dist/*.ipa

  release:
    if: inputs.release
    needs: [android, android-run, ios, ios12]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: mobile-*
          path: files
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          V="${TAG#mobile-v}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already released"; exit 0; fi
          awk -v v="$V" '$0 ~ "^## "v"$" {f=1; next} /^## / {f=0} f' mobile/CHANGELOG.md > notes.md
          # --latest=false: "Latest" stays on the desktop app, which its updater falls back to
          gh release create "$TAG" files/* --target "$GITHUB_SHA" --title "Jace Social for phones $V" --notes-file notes.md --latest=false

  store:
    if: inputs.release
    needs: release
    runs-on: ubuntu-latest
    env:
      JACE_STORE_TOKEN: ${{ secrets.JACE_STORE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Publish to Jace Store
        run: |
          if [ -z "$JACE_STORE_TOKEN" ]; then echo "::error::JACE_STORE_TOKEN isn't set"; exit 1; fi
          python3 packaging/publish_app.py "${{ inputs.tag }}"
